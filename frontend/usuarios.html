<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table class="table">
  <thead>
    <tr>
      <!-- MODIFICACION: Se cambiaron los encabezados para que coincidan con los datos (id, nombre, telefono) -->
      <th scope="col">ID</th>
      <th scope="col">Nombre</th>
      <th scope="col">Telefono</th>
    </tr>
  </thead>
  <tbody id="tabla">
  </tbody>
</table>

 <script>
        // MODIFICACION: Se cambió la URL de fetch a una ruta relativa '/usuarios' para que funcione sin importar el puerto
        fetch('/usuarios')
            .then(res => res.json())
            .then(data => {
                const tabla = document.getElementById('tabla');
                tabla.innerHTML = data.map(u => `
                    <tr>
                        <td>${u.id}</td>
                        <td>${u.nombre}</td>
                        <td>${u.telefono}</td>
                    </tr>
                `).join('');
            })
            .catch(err => {
                alert('Error: ' + err.message);
            });
    </script>
</body>

</html>
